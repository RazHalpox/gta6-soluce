<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a0f4d"/>
      <stop offset=".45" stop-color="#8a2be2"/>
      <stop offset=".75" stop-color="#ff4fa3"/>
      <stop offset="1" stop-color="#ff9a3c"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe066"/>
      <stop offset="1" stop-color="#ff5e8a"/>
    </linearGradient>
    <clipPath id="sunclip"><circle cx="256" cy="300" r="128"/></clipPath>
  </defs>
  <rect width="512" height="512" fill="url(#sky)"/>
  <!-- soleil rayé -->
  <g clip-path="url(#sunclip)">
    <rect x="120" y="160" width="272" height="280" fill="url(#sun)"/>
    <g fill="#c2307a">
      <rect x="100" y="318" width="312" height="9"/>
      <rect x="100" y="344" width="312" height="13"/>
      <rect x="100" y="372" width="312" height="17"/>
      <rect x="100" y="404" width="312" height="22"/>
    </g>
  </g>
  <!-- mer -->
  <rect x="0" y="410" width="512" height="102" fill="#14082a"/>
  <g stroke="#ff7ab8" stroke-width="6" stroke-linecap="round" opacity=".7">
    <line x1="150" y1="436" x2="230" y2="436"/>
    <line x1="280" y1="436" x2="360" y2="436"/>
    <line x1="190" y1="462" x2="320" y2="462"/>
  </g>
  <!-- palmier -->
  <g fill="#14082a">
    <path d="M118 414 C 126 340, 132 280, 150 220 L 162 223 C 146 284, 140 344, 136 414 Z"/>
    <path d="M156 222 C 120 190, 80 188, 46 204 C 82 200, 114 210, 150 236 Z"/>
    <path d="M156 222 C 130 170, 96 150, 58 150 C 96 166, 124 192, 146 232 Z"/>
    <path d="M156 222 C 168 168, 200 140, 240 136 C 206 156, 180 186, 164 232 Z"/>
    <path d="M156 222 C 196 196, 240 196, 272 214 C 236 210, 198 218, 162 238 Z"/>
    <path d="M156 222 C 150 176, 152 140, 170 112 C 162 146, 164 184, 164 230 Z"/>
    <circle cx="156" cy="228" r="9"/>
  </g>
  <!-- badge coche -->
  <circle cx="392" cy="128" r="74" fill="#3ee0d0"/>
  <circle cx="392" cy="128" r="74" fill="none" stroke="#14082a" stroke-width="10"/>
  <path d="M356 130 L 382 156 L 432 102" fill="none" stroke="#14082a" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
